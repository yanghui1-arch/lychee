<!doctype html>
<html>
  <body style="margin: 0">
    <div id="root"></div>
    <script type="module">
      import React from 'react'
      import { createRoot } from 'react-dom/client'
      import { ScreenshotEditor } from '/src/features/screenshot/ScreenshotEditor.tsx'
      const canvas = document.createElement('canvas')
      canvas.width = 1280
      canvas.height = 800
      const ctx = canvas.getContext('2d')
      ctx.fillStyle = '#f4f4f5'
      ctx.fillRect(0, 0, 1280, 800)
      for (let i = 0; i < 12; i++) {
        ctx.fillStyle = i % 2 ? '#a1a1aa' : '#d4d4d8'
        ctx.fillRect(150, 60 + i * 52, 900, 35)
        ctx.fillStyle = '#27272a'
        ctx.font = '20px sans-serif'
        ctx.fillText('Screenshot feature test ' + i, 170, 85 + i * 52)
      }
      window.calls = []
      window.fixture = {
        image: canvas.toDataURL(),
        width: 1280,
        height: 800,
        workArea: { x: 0, y: 0, width: 1280, height: 752 },
      }
      window.runtime = {}
      window.go = {
        app: {
          WindowService: {
            RecognizeScreenshot: async () => {
              calls.push('ocr')
              if (window.ocrPending) await new Promise(resolve => { window.finishOCR = resolve })
              if (window.ocrFailure) throw Error('OCR fixture failure')
              return window.ocrRegions ?? []
            },
            LogScreenshotEvent: async () => {},
            ScreenshotReady: async () => {
              calls.push('ready')
            },
            CancelScreenshot: async () => {
              calls.push('cancel')
            },
            PinScreenshot: async (x, y, w, h) => {
              calls.push(['pin', x, y, w, h])
            },
            CopyScreenshot: async (data) => {
              if (window.failCopy) throw Error('clipboard busy')
              window.copied = data
              calls.push('copy')
              calls.push('cancel')
            },
            SaveScreenshot: async (data) => {
              window.exported = data
              calls.push('save')
              return 'test.png'
            },
            ScrollScreenshot: async (...args) => {
              calls.push(['scroll', ...args])
              return { ...fixture, added: true }
            },
          },
        },
      }
      HTMLElement.prototype.setPointerCapture = () => {}
      createRoot(document.getElementById('root')).render(
        React.createElement(ScreenshotEditor, { initial: fixture }),
      )
    </script>
  </body>
</html>
